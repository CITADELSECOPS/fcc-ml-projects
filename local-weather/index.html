<!DOCTYPE html><html><head><title>Local Weather</title></head><body><h1 id="title">Local Weather</h1><p>Weather app using browser geolocation + OpenWeatherMap API</p><div id="weather"></div><script>navigator.geolocation && navigator.geolocation.getCurrentPosition(p => document.getElementById("weather").textContent = "Location: " + p.coords.latitude + ", " + p.coords.longitude);</script></body></html>
