<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Movie Sales Treemap</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<h1 id="title">Movie Sales</h1>
<h3 id="description">Top 100 highest grossing movies</h3>
<svg id="chart" width="960" height="600"></svg>
<div id="legend"><svg width="500" height="40"></svg></div>
<div id="tooltip" style="position: absolute; opacity: 0;"></div>
<script>
d3.json("https://cdn.freecodecamp.org/testable-projects-fcc/data/tree_map/movie-data.json").then(data => {
  const w = 960, h = 600;
  const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
  d3.treemap().size([w, h]).padding(1)(root);
  const colorScale = d3.scaleOrdinal(d3.schemeCategory10);
  const svg = d3.select("#chart");
  const cell = svg.selectAll("g").data(root.leaves()).enter().append("g")
    .attr("transform", d => `translate(${d.x0},${d.y0})`);
  cell.append("rect")
    .attr("class", "tile")
    .attr("data-name", d => d.data.name)
    .attr("data-category", d => d.data.category)
    .attr("data-value", d => d.data.value)
    .attr("width", d => d.x1 - d.x0).attr("height", d => d.y1 - d.y0)
    .attr("fill", d => colorScale(d.data.category));
  cell.append("text").selectAll("tspan").data(d => d.data.name.split(/(?=[A-Z][^A-Z])/g)).enter().append("tspan")
    .attr("x", 4).attr("y", (d, i) => 13 + i * 10).text(d => d).style("font-size", "10px");
});
</script>
</body>
</html>
