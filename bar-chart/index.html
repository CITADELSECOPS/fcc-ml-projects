<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Bar Chart - GDP</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>.tooltip { position: absolute; padding: 4px 8px; background: #000; color: #fff; opacity: 0.9; }</style>
</head>
<body>
<h1 id="title">US GDP Over Time</h1>
<svg id="chart" width="900" height="500"></svg>
<div id="tooltip" class="tooltip" style="opacity: 0;"></div>
<script>
const url = "https://raw.githubusercontent.com/freeCodeCamp/ProjectReferenceData/master/GDP-data.json";
d3.json(url).then(data => {
  const dataset = data.data;
  const svg = d3.select("#chart");
  const margin = {top: 20, right: 20, bottom: 40, left: 60};
  const w = 900 - margin.left - margin.right;
  const h = 500 - margin.top - margin.bottom;
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  const x = d3.scaleTime().domain([new Date(dataset[0][0]), new Date(dataset[dataset.length-1][0])]).range([0, w]);
  const y = d3.scaleLinear().domain([0, d3.max(dataset, d => d[1])]).range([h, 0]);
  g.append("g").attr("id", "x-axis").attr("transform", `translate(0,${h})`).call(d3.axisBottom(x));
  g.append("g").attr("id", "y-axis").call(d3.axisLeft(y));
  g.selectAll(".bar").data(dataset).enter().append("rect")
    .attr("class", "bar")
    .attr("data-date", d => d[0])
    .attr("data-gdp", d => d[1])
    .attr("x", d => x(new Date(d[0])))
    .attr("y", d => y(d[1]))
    .attr("width", w / dataset.length)
    .attr("height", d => h - y(d[1]))
    .attr("fill", "steelblue")
    .on("mouseover", function(e, d) {
      d3.select("#tooltip").style("opacity", 0.9)
        .attr("data-date", d[0])
        .html(d[0] + "<br>$" + d[1] + " B")
        .style("left", (e.pageX + 10) + "px").style("top", (e.pageY - 30) + "px");
    })
    .on("mouseout", () => d3.select("#tooltip").style("opacity", 0));
});
</script>
</body>
</html>
