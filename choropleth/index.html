<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>US Education by County</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>
</head>
<body>
<h1 id="title">United States Educational Attainment</h1>
<h3 id="description">Percentage of adults age 25 and older with a bachelor's degree or higher (2010-2014)</h3>
<svg id="chart" width="960" height="600"></svg>
<div id="legend"><svg width="300" height="30"></svg></div>
<div id="tooltip" style="position: absolute; opacity: 0;"></div>
<script>
const dataUrl = "https://cdn.freecodecamp.org/testable-projects-fcc/data/choropleth_map/for_user_education.json";
const topoUrl = "https://cdn.freecodecamp.org/testable-projects-fcc/data/choropleth_map/counties.json";
Promise.all([d3.json(dataUrl), d3.json(topoUrl)]).then(([eduData, us]) => {
  const eduMap = new Map(eduData.map(d => [d.fips, d]));
  const svg = d3.select("#chart");
  const path = d3.geoPath();
  const colorScale = d3.scaleQuantize().domain([d3.min(eduData, d => d.bachelorsOrHigher), d3.max(eduData, d => d.bachelorsOrHigher)]).range(["#e5f5e0","#a1d99b","#41ab5d","#005a32"]);
  svg.append("g").selectAll("path").data(topojson.feature(us, us.objects.counties).features).enter().append("path")
    .attr("class", "county")
    .attr("data-fips", d => d.id)
    .attr("data-education", d => (eduMap.get(d.id) || {bachelorsOrHigher: 0}).bachelorsOrHigher)
    .attr("d", path)
    .attr("fill", d => colorScale((eduMap.get(d.id) || {bachelorsOrHigher: 0}).bachelorsOrHigher));
});
</script>
</body>
</html>
